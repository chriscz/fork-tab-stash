id: E02
title: Stash all open tabs
given:
  - Three local pages are open in the window, and the stash is empty.
when:
  - The user clicks "Stash all" in the open-tabs section of the stash list.
then:
  - A new folder appears at the top of "Tab Stash" with the three pages, in tab order.
  - step: The stash list shows the new folder, expanded, with its three tabs.
    screenshot:
      name: stash-list-after-stash
      mask:
        - div.forest-item.folder > span.forest-title.editable
  - step: The three tabs are hidden and marked as hidden by Tab Stash.
    browser: firefox
  - step: The three tabs are closed.
    browser: chrome
  - The window still has one visible tab.
notes: |
  The stash starts empty, so the new folder is the only one (hence "at the top").
  Folder names are "saved-<ISO time>".
  The stash list's own tab isn't stashable, so it is the visible tab left.
  "Stash all" is the only link with class exactly "action stash"
  (src/stash-list/window.vue); a.action.stash alone matches a dozen links.
  Hidden tabs carry the session value hidden_by_tab_stash.
  Mutation check: in src/model/tabs.ts, make hide() return before calling
  browser.tabs.hide; the "hidden and marked" step fails.
  The folder's title shows the real date and time it was saved, so the
  screenshot masks it (the stash folder's title is the only span.forest-title
  directly inside a div.forest-item.folder; the open-tabs section's title is
  span.forest-title.disabled) and assertions match the "saved-" prefix.
  Screenshot steps wait for the state they show to settle: here, until the
  window has one visible tab.
  The golden includes the footer's version ("Tab Stash 3.5"), so a version
  bump means regenerating it from the baseline.
  Chrome mutation check: in src/model/tabs.ts:664, in hide()'s fallback for
  browsers that can't hide tabs, replace `await this.remove(tabs);` with
  `// await this.remove(tabs);`, so stashed tabs stay open; "The three tabs
  are closed" fails. So do the screenshot step's wait and "still has one
  visible tab": a tab left open is visible on Chrome.
